<!-- Tema, ilk boyamadan ÖNCE kurulur: sayfa açılırken renk sıçraması olmasın. -->
<script>
try {
  var t = localStorage.getItem('fizik11-tema');
  document.documentElement.dataset.tema = (t === 'acik') ? 'acik' : 'koyu';
  var z = localStorage.getItem('fizik11-zemin');
  document.documentElement.dataset.zemin = (z === 'nebula' || z === 'tahta') ? z : 'gece';
  document.documentElement.dataset.hareket = localStorage.getItem('fizik11-hareket') === '0' ? '0' : '1';
} catch (e) {
  document.documentElement.dataset.tema = 'koyu';
  document.documentElement.dataset.zemin = 'gece';
  document.documentElement.dataset.hareket = '1';
}
</script>

          <button type="button" class="zemin-secenek" data-zemin="nebula" aria-pressed="false"><span class="ornek"></span>Nebula<span class="tik" aria-hidden="true">✓</span></button>

        <button type="button" class="zemin-anahtar" id="hareket-dgm" role="switch" aria-checked="true">
          Hareketli arka plan<span class="anahtar" aria-hidden="true"></span>
        </button>
      </div>
    </div>
    <button class="dgm ikon" id="tema-dgm" aria-pressed="false"
            aria-label="Açık veya koyu tema" title="Açık temaya geç">☀</button>
    <button class="dgm" id="sunum-dgm" aria-pressed="false" title="Sunum modu — yazılar büyür (F11 ile tam ekran)">
      <span aria-hidden="true">⛶</span> Sunum modu
    </button>
  </header>

    <div class="kenar-baslik">Müfredat</div>
    <div class="kenar-liste" id="kenar-liste"></div>
  </nav>

  <main id="icerik" tabindex="-1">
    <div class="bos-durum"><p>Yükleniyor…</p></div>
  </main>
